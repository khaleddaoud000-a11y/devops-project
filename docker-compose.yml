version: "3"
services:
  nginx:
    image: nginx
    ports:
      - "8084:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - mynet

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: khaled
      POSTGRES_PASSWORD: khaled123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mynet

volumes:
  postgres_data:

networks:
  mynet:
    driver: bridge
